[project]
name = "td-atlas"
version = "0.1.0"
description = "An atomised index of TouchDesigner plus a live bridge, exposed to AI agents over MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "grigabyte" }]
requires-python = ">=3.11"
keywords = ["touchdesigner", "mcp", "agents", "creative-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    # Pinned below 2.0: that release removed mcp.server.fastmcp, which
    # mcp/server.py is written against. Moving to the 2.x server API is a
    # separate piece of work, not a version bump.
    "mcp>=1.2,<2",
]

[project.urls]
Repository = "https://github.com/grigabyte/td-atlas"
Issues = "https://github.com/grigabyte/td-atlas/issues"

[project.scripts]
td-atlas = "td_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/td_atlas"]

[dependency-groups]
dev = ["pytest>=8.0"]
