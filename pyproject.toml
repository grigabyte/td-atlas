[project]
name = "td-atlas"
version = "0.1.0"
description = "An atomised index of TouchDesigner plus a live bridge, exposed to AI agents over MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "grigabyte" }]
requires-python = ">=3.11"
keywords = [
    "touchdesigner",
    "mcp",
    "model-context-protocol",
    "agents",
    "llm",
    "creative-coding",
    "generative-art",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    # Classifiers below list only versions actually run, not requires-python's
    # intent. Add one when it's been run, not because it "should work".
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Pinned below 2.0: that release removed mcp.server.fastmcp, which
    # mcp/server.py is written against. Moving to the 2.x server API is a
    # separate piece of work, not a version bump.
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/grigabyte/td-atlas"
Repository = "https://github.com/grigabyte/td-atlas"
Issues = "https://github.com/grigabyte/td-atlas/issues"

[project.scripts]
td-atlas = "td_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/td_atlas"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# The suite runs without TouchDesigner, and `addopts` is what makes that true
# rather than a habit: the tests that drive a *running* instance carry the
# `live` marker and are deselected by default, so a plain `pytest` collects
# only what a clean checkout can actually execute. `pytest -m live` selects
# them instead — the flag is a plain store option, so the one on the command
# line replaces the one here.
#
# Before this existed the live tests were collected and skipped, which reads
# as "24 checks ran" in every summary while none of them had run.
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: needs a running TouchDesigner with the td-atlas bridge (pytest -m live)",
]
testpaths = ["tests"]
