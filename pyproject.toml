[project]
name = "td-atlas"
version = "0.1.0"
description = "An atomised index of TouchDesigner plus a live bridge, exposed to AI agents over MCP."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "grigabyte" }]
requires-python = ">=3.11"
keywords = [
    "touchdesigner",
    "mcp",
    "model-context-protocol",
    "agents",
    "llm",
    "creative-coding",
    "generative-art",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    # Classifiers below list only versions actually run, not requires-python's
    # intent. Add one when it's been run, not because it "should work".
    # 3.11: the whole suite was run on it on this machine 2026-09-06, and every
    # push runs it in CI. Counts belong to a run, not to a classifier.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Pinned below 2.0: that release removed mcp.server.fastmcp, which
    # mcp/server.py is written against. Moving to the 2.x server API is a
    # separate piece of work, not a version bump.
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/grigabyte/td-atlas"
Repository = "https://github.com/grigabyte/td-atlas"
Issues = "https://github.com/grigabyte/td-atlas/issues"

[project.scripts]
td-atlas = "td_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/td_atlas"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# The suite runs without TouchDesigner, and `addopts` is what makes that true
# rather than a habit: the tests that drive a *running* instance carry the
# `live` marker and are deselected by default, so a plain `pytest` collects
# only what a clean checkout can actually execute. `pytest -m live` selects
# them instead — the flag is a plain store option, so the one on the command
# line replaces the one here.
#
# Before this existed the live tests were collected and skipped, which reads
# as "24 checks ran" in every summary while none of them had run.
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: needs a running TouchDesigner with the td-atlas bridge (pytest -m live)",
]
testpaths = ["tests"]

[tool.ruff]
# `target-version` is inferred from `requires-python`, so the syntax floor the
# package claims is the syntax floor ruff enforces — one number, not two. That
# survives the `extend` in src/td_atlas/component/ruff.toml: `ruff check
# --show-settings` on handler.py reports target version 3.11 there too, which
# is what the code inside TouchDesigner actually runs on.
line-length = 88

[tool.ruff.lint]
# Measured 2026-09-06 with ruff 0.16.6, on the tree as it stood before these
# fixes — 69 Python files walked, 67 of them tracked. What ruff was run with,
# and what it found:
#
#   --select ALL (every rule)       7612
#   ruff's own default (E4,E7,E9,F)  433
#   E,F,W                            151
#   E4,E7,E9,F,W (this set)           88 -> 0
#
# The 88 were 80 undefined names (TouchDesigner's injected globals, declared
# in src/td_atlas/component/ruff.toml) and 8 real ones, all fixed here.
#
# The rules left out were left out deliberately, not because the count was
# large. E501 (63 hits) would reflow comments that are wrapped to say what
# they mean; UP031 (168) would rewrite `%`-formatting that handler.py uses on
# purpose, since a literal `%` in a probe template is `%%` and f-strings there
# would be a silent trap; BLE001 (73) and S110 (14) fire on the broad excepts
# the bridge is built out of — a handler that lets an exception escape freezes
# TouchDesigner, so those are the design and not a lapse. Re-selecting any of
# them means changing the code, which is a piece of work, not a config line.
select = ["E4", "E7", "E9", "F", "W"]
