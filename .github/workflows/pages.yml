# The short install address, the site around it, and why nothing here can go
# stale.
#
# The README hands out `curl -fsSL https://grigabyte.github.io/td-atlas/i | sh`.
# That line has to fetch exactly the `install.sh` that is in `main`: a copy
# that quietly falls behind is a worse failure than a long URL, because the
# person running it has no way to see that it did.
#
# So no copy is kept. This workflow renames the tracked `install.sh` to `i`
# at deploy time and publishes that. There is nothing to keep in step — the
# only `install.sh` in the repository is the one being served, and the
# shorter name is made on the way out.
#
# The name has no extension on purpose: that is the whole of the saving.
# Pages serves it as a static file, and `sh` reads the pipe without ever
# asking what the content type was.
#
# The landing page and the documentation are published on the same argument.
# They are built here, from the checkout, and never uploaded from anyone's
# working copy — so what is served is what is in `main`. That is also why the
# run is no longer narrowed to the paths of the installer: a sentence fixed in
# the repository that never reaches the site is the same silent drift in a
# different file, so every push to `main` rebuilds and republishes.
#
# The base path is one variable. Project Pages serves this repository under
# `/td-atlas/`, not at a domain root, so every absolute address on the site
# carries that prefix. `BASE` is read once, in `site/baza.mjs`, and both
# halves of the build take it from there — vite for the landing page, the
# generator for the 21 documentation sections. Spelled twice it would
# disagree eventually, and the links between the halves are what would break.
#
# The checkout is not shallow on purpose. The generator asks git two questions
# a shallow clone answers badly. It reads the English file a translation was
# made from out of the history, which simply fails and falls back to the
# current text. And it asks for the date of the last commit that touched the
# sources — a shallow root shows every file as added, so the answer is the
# date of whatever commit is HEAD, whether or not it went near the
# documentation. The site builds either way, carrying a translation notice
# that is quietly wrong.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing at the workflow level: a job names what it needs, so a job added
# later starts with nothing rather than inheriting the deploy's rights.
permissions: {}

# A deploy already in flight is not cancelled. Cancelling one leaves the site
# serving whatever the run before it published — which is exactly the drift
# this file exists to rule out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # `deployments: write` is for the last step alone, which removes the
    # records older runs left behind. A job-level block replaces the
    # workflow's rather than adding to it, so the three the deploy itself
    # needs are named here too.
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version `ci.yml` pins, and the one vite's `engines` field accepts.
      # `latest` would make an upstream release a red run here for reasons that
      # have nothing to do with the commit under test — the same reasoning that
      # pins the linter there.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci --prefix site

      - name: Build the site
        run: BASE=/td-atlas/ npm --prefix site run build

      # `dist` moves first and whole, then the installer lands beside it. The
      # order is the safe one in both directions: nothing built can overwrite
      # `i`, and the check says so out loud rather than letting `i` overwrite
      # a page of the site if one is ever named that.
      - name: Lay out the site
        run: |
          mv site/dist _site
          if [ -e _site/i ]; then
            echo "the built site already has an _site/i — refusing to overwrite it" >&2
            exit 1
          fi
          cp install.sh _site/i

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # Every run leaves a `github-pages` record in the repository's
      # Deployments list, and nothing ever takes one away. Pages serves the
      # latest deployment and nothing else, so every older record names a site
      # that is no longer there: a list that only grows, one line per push.
      #
      # This run's own record is kept, and it is found by commit, not by
      # position: the newest `github-pages` record for `GITHUB_SHA`. The
      # concurrency group above runs deploys one at a time, so no later run
      # can have made a newer one yet. If none is found, nothing is removed —
      # deleting the record of the site being served is worse than leaving
      # the clutter for the next run.
      #
      # The API deletes only an inactive record, hence two calls for each.
      # Only `environment=github-pages` is asked for, so the `pypi` records
      # are never read, let alone touched. A record that will not go is
      # clutter left for the next run, not a broken site, so this step cannot
      # fail the deploy, and it says what it removed and what it could not.
      - name: Remove older Pages deployment records
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          records="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" \
            --jq '.[] | "\(.id) \(.sha)"' | sort -k1,1nr)"
          current="$(printf '%s\n' "$records" \
            | awk -v sha="$GITHUB_SHA" '$2 == sha { print $1; exit }')"
          if [ -z "$current" ]; then
            echo "no github-pages record for $GITHUB_SHA; removing nothing"
            exit 0
          fi
          echo "keeping $current, the record of this run"
          removed=0
          failed=0
          for id in $(printf '%s\n' "$records" \
              | awk -v keep="$current" 'NF && $1 != keep { print $1 }'); do
            if gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
                 -f state=inactive >/dev/null \
               && gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/$id" >/dev/null
            then
              echo "removed $id"
              removed=$((removed + 1))
            else
              echo "could not remove $id"
              failed=$((failed + 1))
            fi
          done
          echo "removed $removed older github-pages record(s), $failed left behind"
