# What this run can and cannot tell you.
#
# TouchDesigner is not installed on a GitHub runner and cannot be: it is a
# licensed desktop application with no headless distribution. So this run
# exercises the two layers that do not need it — the atom index and the
# project reader — and the bridge only as far as its wire format.
#
# So two sets do not run here, and neither is a defect. The `live` marker is
# deselected outright (it needs a running instance with the bridge; see
# AGENTS.md). The tests that shell out to `toeexpand`/`toecollapse` or read a
# shipped example library skip, because there is no installation to find. A
# red run is a failure; a skipped one of these is the expected shape.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # macOS is the platform the project is developed and measured on. Windows
    # is in the matrix because the Windows code paths — `install.py`
    # `_candidates_windows`, `expand.py` `_tool`, the `PureWindowsPath`
    # handling in the project reader — cannot be read anywhere else. The first
    # run of this leg (2026-09-07, run 34111353871) found eleven failures, four
    # of them defects in the code; what it still cannot reach is TouchDesigner
    # itself, which no runner has.
    # Their unit tests pass on macOS; only this leg says whether the paths
    # they describe are real.
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not hide the others: the whole point of the matrix
      # is to learn which combinations fail, not that some combination did.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned: an unpinned linter turns a release upstream into a
          # red build here for reasons that have nothing to do with the commit
          # under test. The rule selection is in pyproject.toml, and the counts
          # behind it were measured with this exact version.
          python -m pip install -e . pytest "ruff==0.16.6"

      - name: ruff
        shell: bash
        run: ruff check .

      - name: pytest
        shell: bash
        run: pytest -q

  bundle:
    # Packaging is checked once, not per matrix cell: the bundle is built from
    # `git archive HEAD`, so it is identical whatever interpreter packs it, and
    # `tests/test_packaging.py` already runs on every cell of `check` above.
    # What this job adds is that `scripts/build_mcpb.py` still runs at all —
    # it regenerates `packaging/manifest.json`, and a build that dies leaves
    # the committed copy correct but unreproducible.
    #
    # 3.11 is the floor the package claims, so the build runs on the floor.
    name: bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `build_mcpb.py` shells out to `npx @anthropic-ai/mcpb` to validate and
      # pack; that is the reference implementation of the bundle format, and
      # reimplementing it here would be a second thing to keep in step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Build the bundle
        run: python scripts/build_mcpb.py

      - name: Packaging checks
        run: pytest -q tests/test_packaging.py

